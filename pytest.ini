[pytest]
# Default collection is the active source test tree only.
# Generated runtime exports, validation copies, recovery overlays, and local tools
# are runtime evidence, not root pytest source.
testpaths = tests
norecursedirs =
    .venv
    venv
    .ci_venv
    runtime
    logs
    updates
    __pycache__
    .pytest_cache
    tests/legacy
    tests/runtime
markers =
	legacy_behavior_test: historical exact-structure or exact-wording tests kept only for archaeology.
	runtime_live: explicit live-runtime validation tests that are not part of the default suite.
