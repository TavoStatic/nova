[pytest]
# Default collection excludes legacy tests.
# Legacy tests enforce old code structure and must not run in default suite.
# To run explicitly: pytest tests/legacy -q
norecursedirs = tests/legacy tests/runtime
markers =
	legacy_behavior_test: historical exact-structure or exact-wording tests kept only for archaeology.
	runtime_live: explicit live-runtime validation tests that are not part of the default suite.
