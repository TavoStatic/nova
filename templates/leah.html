<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Leah</title>
  <link rel="stylesheet" href="/static/leah.css?v={{LEAH_CSS_VERSION}}" />
</head>
<body>
  <div class="leah-app">
    <header class="leah-top">
      <div class="wordmark">Leah</div>
      <p id="activityHeadline" class="status-line">Nova is here.</p>
      <span id="presenceHealth" class="quiet-dot" title="Health">…</span>
    </header>

    <main class="leah-stage">
      <div id="chat" class="chat-stream"></div>
    </main>

    <footer class="leah-dock">
      <div id="sensingDock" class="sensing-dock" hidden>
        <video id="cameraPreview" class="camera-preview" autoplay playsinline muted></video>
        <canvas id="cameraCanvas" hidden></canvas>
        <div id="cameraEmpty" class="sr-only">Camera preview</div>
        <div id="transcriptBox" class="transcript" hidden></div>
        <ul id="stagedList" class="staged-list"></ul>
      </div>

      <form id="composerForm" class="composer">
        <div id="dropZone" class="composer-shell">
          <textarea id="messageInput" rows="2" placeholder="Speak, or type…"></textarea>
        </div>
        <div class="composer-bar">
          <input id="fileInput" type="file" multiple hidden />
          <button id="btnUpload" type="button" class="icon-btn" title="Share a file">File</button>
          <button id="btnCamera" type="button" class="icon-btn" title="Camera">Camera</button>
          <button id="btnCapture" type="button" class="icon-btn" title="Capture" hidden>Capture</button>
          <button id="btnMic" type="button" class="icon-btn" title="Listen">Mic</button>
          <button id="btnListen" type="button" class="icon-btn" title="Keep listening">Listen</button>
          <button id="btnVoice" type="button" class="icon-btn" title="Nova can speak">Voice</button>
          <button id="btnSend" type="submit" class="send-btn">Send</button>
        </div>
      </form>
    </footer>
  </div>

  <!-- Kept for leah.js; not shown -->
  <div class="sr-only" aria-hidden="true">
    <div id="presenceThinking"></div>
    <div id="presenceListening"></div>
    <div id="presenceVoice"></div>
    <div id="presenceCamera"></div>
    <div id="presenceMood"></div>
    <div id="presenceUploads"></div>
    <div id="sessionLabel"></div>
    <div id="userLabel"></div>
    <div id="modeLabel"></div>
    <div id="moodLabel"></div>
    <div id="welcomeUser"></div>
    <div id="activityDetail"></div>
    <div id="heroState"></div>
    <div id="heroInputs"></div>
    <div id="pulseRuntime"></div>
    <div id="pulseQueue"></div>
    <div id="pulseSearch"></div>
    <div id="pulseMaintenance"></div>
    <div id="pulseTask"></div>
  </div>

  <script>
    window.__LEAH_CONFIG__ = {
      healthUrl: "/api/health",
      controlStatusUrl: "/api/leah/pulse",
      chatUrl: "/api/chat",
      chatHistoryUrl: "/api/chat/history",
      chatResumeUrl: "/api/chat/resume",
      chatLoginUrl: "/api/chat/login",
      chatLogoutUrl: "/api/chat/logout",
      uploadUrl: "/api/chat/upload"
    };
  </script>
  <script src="/static/leah.js?v={{LEAH_JS_VERSION}}"></script>
</body>
</html>
